name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: provcfg
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7



      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting
        run: nix develop --command just ci-fmt-check

      - name: Run clippy
        run: nix develop --command just ci-clippy


      - name: Run tests
        run: nix develop --command just test
        env:
          PROVCFG_TEST_POSTGRES_URL: postgres://postgres:provcfg@localhost:5432/postgres


      - name: Run documentation tests
        run: nix develop --command just test-docs
        env:
          RUSTDOCFLAGS: "-D warnings"
